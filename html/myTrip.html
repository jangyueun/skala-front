<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 여행 앨범</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">

        <h1>🌍 나의 여행 앨범 🎵</h1>
        <audio controls>
            <source src="../media/FeelsLike.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <hr>

        <div class="trip-grid-container">
            <p class="trip-card">
                <img src="../media/tokyo.jpg" alt="도쿄" width="400" height="200"><br>도쿄(2026년)
            </p>
            <p class="trip-card">
                <img src="../media/jeju.jpg" alt="제주도" width="400" height="200"><br>제주도(2025년)
            </p>
            <p class="trip-card">
                <img src="../media/Busan.jpg" alt="부산" width="400" height="200"><br>부산(2025년)
            </p>
        </div>

        <hr>

        <h2>📹 나의 여행 브이로그</h2>
        <p>
            <video width="400" height="225" controls>
                <source src="../media/nintendoworld.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <br>닌텐도월드 🏰
        </p>

    </div>

</html>
